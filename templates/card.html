<a class="movie-card" href="{% url 'detail' movie.slug %}"><div class="poster">{% if movie.poster_image %}<img src="{{ movie.poster_image }}" alt="{{ movie.title }} poster" loading="lazy">{% else %}<div class="poster-fallback">{{ movie.title }}</div>{% endif %}<span class="card-tag">TRAILER</span><span class="card-play">▶</span>{% if movie.average %}<span class="card-rating">★ {{ movie.average|floatformat:1 }}</span>{% endif %}</div><h3>{{ movie.title }}</h3><p>{{ movie.year }} <span>·</span> {{ movie.genres.first.name|default:'Movie' }} <span>·</span> {{ movie.age_rating }}</p></a>
